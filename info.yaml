# Tiny Tapeout project information
project:
  title:        "Pulsebox 4-Player Quiz Buzzer"      # Project title
  author:       "Carlos"                             # Your name
  discord:      ""                                   # Your discord username (optional)
  description:  "4-player buzzer with lockout and true/false evaluation LEDs" # Short description
  language:     "Verilog"
  clock_hz:     10000                                # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 340 x 160 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 3x4 or 4x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_pulsebox"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "Player 1 button"
  ui[1]: "Player 2 button"
  ui[2]: "Player 3 button"
  ui[3]: "Player 4 button"
  ui[4]: "True (Correct) button"
  ui[5]: "False (Incorrect) button"
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "Player 1 LED"
  uo[1]: "Player 2 LED"
  uo[2]: "Player 3 LED"
  uo[3]: "Player 4 LED"
  uo[4]: "Correct answer LED"
  uo[5]: "Incorrect answer LED"
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
